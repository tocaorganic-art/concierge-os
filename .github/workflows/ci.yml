# Portao de qualidade a cada PR e push na main: lint, i18n, typecheck,
# testes das regras financeiras e build. Nao publica nada (deploy e manual no Base44).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
